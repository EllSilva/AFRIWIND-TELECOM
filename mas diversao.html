<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mais Diversão - Planos e Aplicativos</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts - Montserrat / Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --green-primary: #12821d;
            --green-badge: #8cfa00;
            --border-color: #d1d5db;
            --bg-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: #333;
            margin: 0;
            padding: 40px 15px;
        }

        .section-container {
            max-width: 1050px;
            margin: 0 auto;
        }

        /* Títulos */
        .main-title {
            color: var(--green-primary);
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .main-subtitle {
            color: #555;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 40px;
        }

        /* Container dos Cards de Apps */
        .app-box {
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px 20px 25px 20px;
            position: relative;
            background-color: #fff;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        /* Badges/Pills Verdes do Topo das Caixas */
        .box-badge {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--green-badge);
            color: #000;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 5px 22px;
            border-radius: 20px;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Grid dos Apps */
        .apps-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-top: 10px;
        }

        /* Estilização individual dos Cards/Logos de Apps */
        .app-card {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .app-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.15);
        }

        /* Estilização específica para logos em fundo claro */
        .app-card.bg-white-logo {
            background-color: #fff;
            border: 1px solid #eaeaea;
        }

        .app-card.bg-white-logo img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        /* Ajustes Responsivos */
        @media (max-width: 991px) {
            .main-title {
                font-size: 1.6rem;
            }
            .app-box {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <div id="app" class="container section-container">
        
        <!-- Título e Descrição da Seção -->
        <div class="row">
            <div class="col-12">
                <h2 class="main-title">{{ title }}</h2>
                <p class="main-subtitle" v-html="subtitle"></p>
            </div>
        </div>

        <!-- Bloco Principal de Conteúdo em 2 Colunas -->
        <div class="row g-4 align-items-stretch">
            
            <!-- Coluna 1: Apps planos Standard -->
            <div class="col-12 col-lg-6">
                <div class="app-box">
                    <span class="box-badge">Apps planos Standard</span>
                    <div class="apps-grid">
                        <div v-for="(app, index) in standardApps" 
                             :key="'std-' + index" 
                             class="app-card"
                             :class="{ 'bg-white-logo': app.isWhiteBg }"
                             :style="app.styleObj"
                             :title="app.name">
                             
                            <!-- Se for logo com vetor/imagem direto e fundo branco -->
                            <img v-if="app.imageUrl" :src="app.imageUrl" :alt="app.name">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna 2: Apps planos Premium -->
            <div class="col-12 col-lg-6">
                <div class="app-box">
                    <span class="box-badge">Apps planos Premium</span>
                    <div class="apps-grid">
                        <div v-for="(app, index) in premiumApps" 
                             :key="'prem-' + index" 
                             class="app-card"
                             :class="{ 'bg-white-logo': app.isWhiteBg }"
                             :style="app.styleObj"
                             :title="app.name">
                             
                            <!-- Se for logo com vetor/imagem direto e fundo branco -->
                            <img v-if="app.imageUrl" :src="app.imageUrl" :alt="app.name">
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Vue.js 2 CDN -->

    </script>
</body>
</html>
