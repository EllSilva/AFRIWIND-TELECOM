<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contactos - TVCABO</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background-color: #fcfcfc;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #333;
    }

    /* Banner / Hero Section */
    .hero-banner {
      background-color: #a8b0b5; /* tom cinza do fundo */
      position: relative;
      min-height: 250px;
      overflow: hidden;
    }

    .hero-title {
      color: #ffffff;
      font-weight: 700;
      font-size: 2.5rem;
    }

    .hero-img {
      max-height: 250px;
      object-fit: contain;
      object-position: bottom right;
    }

    /* Seção Apoio ao Cliente */
    .section-title {
      font-weight: 600;
      font-size: 2rem;
      color: #000;
    }

    .section-subtitle {
      font-size: 0.95rem;
      color: #555;
    }

    /* Cards de Contacto */
    .contact-icon {
      font-size: 2.2rem;
      color: #00a8e8; /* Azul claro estilo TVCABO */
      margin-bottom: 15px;
    }

    .contact-text {
      font-weight: 700;
      font-size: 1.1rem;
      color: #111;
    }

    .contact-subtext {
      font-size: 0.8rem;
      color: #666;
      margin-top: 8px;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Banner Principal -->
    <div class="hero-banner d-flex align-items-center">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-6 col-12 my-4">
            <h1 class="hero-title pl-md-4">{{ bannerTitle }}</h1>
          </div>
          <div class="col-md-6 col-12 text-right d-none d-md-block">
            <!-- Imagem da atendente com joinha (Substitua pela imagem real se necessário) -->
            <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80" 
                 alt="Atendimento ao cliente" 
                 class="img-fluid hero-img">
          </div>
        </div>
      </div>
    </div>

    <!-- Conteúdo Principal / Apoio ao Cliente -->
    <main class="container py-5">
      <!-- Título da Seção -->
      <div class="text-center mb-5">
        <h2 class="section-title">{{ sectionTitle }}</h2>
        <p class="section-subtitle">{{ schedule }}</p>
      </div>

      <!-- Grid de Cartões de Contacto -->
      <div class="row text-center justify-content-center">
        <div class="col-md-4 col-sm-12 mb-4" v-for="(item, index) in contacts" :key="index">
          <div class="px-3">
            <i :class="[item.icon, 'contact-icon']"></i>
            <p class="contact-text mb-1">{{ item.text }}</p>
            <div v-if="item.subtext" class="contact-subtext">
              <p class="mb-0">{{ item.subtext }}</p>
              <p class="mb-0" v-if="item.subtextExtra">{{ item.subtextExtra }}</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Vue.js 2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>

  <script>
    new Vue({
      el: '#app',
      data: {
        bannerTitle: 'Contactos',
        sectionTitle: 'Apoio ao Cliente',
        schedule: 'Todos os dias das 7h00 às 22h00.',
        contacts: [
          {
            icon: 'bi bi-telephone',
            text: '222 680 000 | 923 168 000',
            subtext: '',
            subtextExtra: ''
          },
          {
            icon: 'bi bi-at',
            text: 'tvcabo@tvcabo.co.ao',
            subtext: '',
            subtextExtra: ''
          },
          {
            icon: 'bi bi-phone',
            text: '168 - Linha exclusiva da rede TVCABO*',
            subtext: '* Chamadas gratuitas.',
            subtextExtra: 'Linha de apoio comercial, técnico e facturação.'
          }
        ]
      }
    });
  </script>

</body>
</html>
