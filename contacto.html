<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Mr. Ynet</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Font - Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --green-primary: #12821d;
            --green-border: #d0e7d2;
            --green-btn: #008712;
            --green-btn-hover: #006b0e;
            --input-border: #cccccc;
            --text-dark: #1f2937;
            --text-gray: #4b5563;
        }

        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            margin: 0;
            padding: 60px 0;
        }

        .contact-section {
            max-width: 1050px;
            margin: 0 auto;
        }

        /* --- CARD DO FORMULÁRIO (ESQUERDA) --- */
        .form-card {
            border: 1px solid var(--green-border);
            border-radius: 20px;
            padding: 35px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        .form-title {
            color: var(--green-primary);
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-gray);
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border: 1px solid var(--input-border);
            border-radius: 25px;
            padding: 10px 18px;
            font-size: 0.88rem;
            color: var(--text-dark);
            background-color: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        /* Ajuste de raio para o Textarea */
        textarea.form-control {
            border-radius: 18px;
            resize: vertical;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--green-primary);
            box-shadow: 0 0 0 0.25rem rgba(18, 130, 29, 0.15);
        }

        .form-control::placeholder {
            color: #aaaaaa;
            font-size: 0.85rem;
        }

        .btn-send {
            background-color: var(--green-btn);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 8px;
            padding: 10px 32px;
            border: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-send:hover {
            background-color: var(--green-btn-hover);
            color: #ffffff;
        }

        /* --- INFORMAÇÕES DE CONTATO (DIREITA) --- */
        .info-container {
            padding-left: 20px;
        }

        .company-name {
            color: var(--green-primary);
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: -0.3px;
            text-transform: uppercase;
        }

        .info-list {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-gray);
        }

        .info-item i {
            color: var(--green-primary);
            font-size: 1rem;
            margin-top: 2px;
            width: 16px;
            text-align: center;
        }

        .schedule-title {
            color: var(--green-primary);
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        /* Responsividade */
        @media (max-width: 991px) {
            .info-container {
                padding-left: 0;
                margin-top: 40px;
            }
            .form-card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <div id="app" class="container contact-section">
        <div class="row align-items-center">
            
            <!-- Coluna da Esquerda: Formulário Fale Conosco -->
            <div class="col-12 col-lg-6">
                <div class="form-card">
                    <h2 class="form-title">Fale conosco</h2>
                    
                    <form @submit.prevent="handleSubmit">
                        <!-- Seu nome -->
                        <div class="mb-3">
                            <label class="form-label">Seu nome</label>
                            <input type="text" class="form-control" v-model="form.nome" required>
                        </div>

                        <!-- Seu e-mail e WhatsApp lado a lado -->
                        <div class="row g-3 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Seu e-mail</label>
                                <input type="email" class="form-control" v-model="form.email" required>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label">WhatsApp</label>
                                <input type="tel" class="form-control" v-model="form.whatsapp" required>
                            </div>
                        </div>

                        <!-- Assunto -->
                        <div class="mb-3">
                            <label class="form-label">Assunto</label>
                            <select class="form-select" v-model="form.assunto" required>
                                <option value="" disabled selected>Selecione um assunto</option>
                                <option v-for="(opcao, index) in assuntos" :key="index" :value="opcao">
                                    {{ opcao }}
                                </option>
                            </select>
                        </div>

                        <!-- Mensagem -->
                        <div class="mb-4">
                            <label class="form-label">Mensagem</label>
                            <textarea class="form-control" rows="4" placeholder="Mensagem" v-model="form.mensagem" required></textarea>
                        </div>

                        <!-- Botão Enviar alinhado à direita -->
                        <div class="text-end">
                            <button type="submit" class="btn btn-send">Enviar</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Coluna da Direita: Informações de Contato -->
            <div class="col-12 col-lg-6">
                <div class="info-container">
                    
                    <!-- Razão Social -->
                    <h3 class="company-name">{{ company.name }}</h3>

                    <!-- Lista de Dados Principais -->
                    <ul class="info-list">
                        <li class="info-item">
                            <i class="fa-solid fa-receipt"></i>
                            <span>CNPJ: {{ company.cnpj }}</span>
                        </li>
                        <li class="info-item">
                            <i class="fa-solid fa-location-dot"></i>
                            <span>{{ company.address }}</span>
                        </li>
                        <li class="info-item">
                            <i class="fa-solid fa-map-pin"></i>
                            <span>{{ company.cityStateCep }}</span>
                        </li>
                        <li class="info-item">
                            <i class="fa-solid fa-phone"></i>
                            <span>{{ company.phone }}</span>
                        </li>
                    </ul>

                    <!-- Horário de Atendimento -->
                    <h4 class="schedule-title">Horário de atendimento:</h4>
                    <ul class="info-list">
                        <li class="info-item" v-for="(schedule, index) in schedules" :key="index">
                            <i class="fa-regular fa-clock"></i>
                            <span>{{ schedule }}</span>
                        </li>
                    </ul>

                </div>
            </div>

        </div>
    </div>

    <!-- Vue.js 2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>

    <script>
        new Vue({
            el: '#app',
            data: {
                // Objeto do formulário reativo
                form: {
                    nome: '',
                    email: '',
                    whatsapp: '',
                    assunto: '',
                    mensagem: ''
                },
                
                // Lista de opções de assunto
                assuntos: [
                    'Suporte Técnico',
                    'Planos e Vendas',
                    'Financeiro / 2ª Via',
                    'Cancelamento / Mudança de Endereço',
                    'Outros Assuntos'
                ],

                // Dados cadastrais da empresa
                company: {
                    name: 'INFORMAÇÕES DE CONTACTO',
                    cnpj: '08.695.966/0001-00',
                    address: 'Rua Cônego Manoel Maria, nº 32, centro',
                    cityStateCep: 'Mairi / Ba - CEP: 44.630-000',
                    phone: '244933741797'
                },

                // Horários de atendimento
                schedules: [
                    'Segunda a sexta das 8h às 18h',
                    'Sábado das 8h às 12h'
                ]
            },
            methods: {
                handleSubmit() {
                    alert(`Obrigado, ${this.form.nome}! Sua mensagem sobre "${this.form.assunto}" foi enviada com sucesso.`);
                    
                    // Limpar formulário
                    this.form = {
                        nome: '',
                        email: '',
                        whatsapp: '',
                        assunto: '',
                        mensagem: ''
                    };
                }
            }
        });
    </script>
</body>
</html>
