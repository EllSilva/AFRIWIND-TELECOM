<div class="container contact-section">
        <div class="row align-items-center">
            
            <!-- Coluna da Esquerda: Formulário Fale Conosco -->
            <div class="col-12 col-lg-6">
                <div class="form-card">
                    <h2 class="form-title">Fale conosco</h2>
                    
                    <form @submit.prevent="handleSubmit">
                        <!-- Seu nome -->
                        <div class="mb-3">
                            <label class="form-label">Seu nome</label>
                            <input type="text" class="form-control" v-model="form.nome" required>
                        </div>

                        <!-- Seu e-mail e WhatsApp lado a lado -->
                        <div class="row g-3 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label">Seu e-mail</label>
                                <input type="email" class="form-control" v-model="form.email" required>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label">WhatsApp</label>
                                <input type="tel" class="form-control" v-model="form.whatsapp" required>
                            </div>
                        </div>

                        <!-- Assunto -->
                        <div class="mb-3">
                            <label class="form-label">Assunto</label>
                            <select class="form-select" v-model="form.assunto" required>
                                <option value="" disabled selected>Selecione um assunto</option>
                                <option v-for="(opcao, index) in assuntos" :key="index" :value="opcao">
                                    {{ opcao }}
                                </option>
                            </select>
                        </div>

                        <!-- Mensagem -->
                        <div class="mb-4">
                            <label class="form-label">Mensagem</label>
                            <textarea class="form-control" rows="4" placeholder="Mensagem" v-model="form.mensagem" required></textarea>
                        </div>

                        <!-- Botão Enviar alinhado à direita -->
                        <div class="text-end">
                            <button type="submit" class="btn btn-send">Enviar</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Coluna da Direita: Informações de Contato -->
            <div class="col-12 col-lg-6">
                <div class="info-container">
                    
                    <!-- Razão Social -->
                    <h3 class="company-name">{{ company.name }}</h3>

                    <!-- Lista de Dados Principais -->
                    <ul class="info-list">
                        <li class="info-item">
                            <i class="fa-solid fa-receipt"></i>
                            <span>CNPJ: {{ company.cnpj }}</span>
                        </li>
                        <li class="info-item">
                            <i class="fa-solid fa-location-dot"></i>
                            <span>{{ company.address }}</span>
                        </li>
                        <li class="info-item">
                            <i class="fa-solid fa-map-pin"></i>
                            <span>{{ company.cityStateCep }}</span>
                        </li>
                        <li class="info-item">
                            <i class="fa-solid fa-phone"></i>
                            <span>{{ company.phone }}</span>
                        </li>
                    </ul>

                    <!-- Horário de Atendimento -->
                    <h4 class="schedule-title">Horário de atendimento:</h4>
                    <ul class="info-list">
                        <li class="info-item" v-for="(schedule, index) in schedules" :key="index">
                            <i class="fa-regular fa-clock"></i>
                            <span>{{ schedule }}</span>
                        </li>
                    </ul>

                </div>
            </div>

        </div>
    </div>
